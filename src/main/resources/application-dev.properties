## local development only: activate with SPRING_PROFILES_ACTIVE=dev

# in-memory H2, no MySQL needed; data is lost on restart
spring.datasource.url=jdbc:h2:mem:connectmessenger;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# fixed signing key so no env vars are needed locally (never use outside dev)
custom.secret=dev-only-secret-dev-only-secret-0123456789

# drop and recreate the schema on every start, then load data.sql
spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

spring.jpa.show-sql=true
server.error.include-message=always
