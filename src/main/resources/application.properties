spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/connectmessenger}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# the schema is owned by Flyway (src/main/resources/db/migration); Hibernate never changes it. The Testcontainers tests run
# with ddl-auto=validate, so CI fails when the migrations and the entities drift apart (not at startup: a database that
# predates Flyway can differ in column types without being broken).
# The `dev` profile (application-dev.properties) skips Flyway and builds a throwaway H2 schema from the entities instead.
spring.flyway.enabled=true
# a database created by the former `ddl-auto=update` has tables but no history: treat it as already at V1
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never

# all lazy loading happens inside @Transactional services
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# 60*60*1000 = 1 hour
custom.jwt-expiration-time=3600000
# required, no default - app refuses to start without it (use a random value, 32+ chars)
custom.secret=${JWT_SECRET}
# comma separated list of origins allowed by CORS and the websocket endpoint
custom.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,https://filip1159.github.io}

custom.s3-bucket=${S3_BUCKET:connect-messenger}
custom.aws-region=${AWS_REGION:eu-central-1}

# health for the load balancer / orchestrator is public; everything else under /actuator needs a login
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# every log line carries the id of its request (RequestIdFilter); for JSON logs set LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs
logging.pattern.correlation=[%X{requestId:-}]\u0020
logging.include-application-name=false

# the OpenAPI description (GET /v3/api-docs, for signed-in users only); docs/openapi.json is its committed copy
springdoc.api-docs.version=openapi_3_0
springdoc.writer-with-order-by-keys=true

# Socket.IO server for the realtime events (its own port; the frontend connects to it directly or through a proxy)
realtime.port=9092
