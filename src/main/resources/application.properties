spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/connectmessenger}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# schema is only dropped/recreated and seeded in the `dev` profile (application-dev.properties)
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never

# all lazy loading happens inside @Transactional services
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# 60*60*1000 = 1 hour
custom.jwt-expiration-time=3600000
# required, no default - app refuses to start without it (use a random value, 32+ chars)
custom.secret=${JWT_SECRET}
# comma separated list of origins allowed by CORS and the websocket endpoint
custom.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,https://filip1159.github.io}

custom.s3-bucket=${S3_BUCKET:connect-messenger}
custom.aws-region=${AWS_REGION:eu-central-1}
